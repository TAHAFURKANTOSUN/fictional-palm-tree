[package]
name = "voxelcraft-rs"
version = "0.1.0"
edition = "2021"
description = "VoxelCraft — sonsuz, prosedürel voxel dünyası. Rust + WebAssembly (WebGL2)."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

# Motor çekirdeği (world/noise/mesh/crafting/survival) saf Rust'tır ve
# `cargo test` ile tarayıcı olmadan doğrulanabilir. Tarayıcıya bağlı
# modüller yalnızca wasm32 hedefinde derlenir.
[dependencies]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3.106"
features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "CanvasGradient",
  "ImageData",
  "DomTokenList",
  "CssStyleDeclaration",
  "WebGl2RenderingContext",
  "WebGlProgram",
  "WebGlShader",
  "WebGlBuffer",
  "WebGlVertexArrayObject",
  "WebGlTexture",
  "WebGlUniformLocation",
  "Event",
  "EventTarget",
  "KeyboardEvent",
  "MouseEvent",
  "WheelEvent",
  "DomRect",
  "Performance",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
